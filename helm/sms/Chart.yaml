apiVersion: v2
name: sms
description: "Helm chart for SMS Checker (frontend+backend). Includes optional monitoring (Prometheus/Grafana)."
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: "79.11.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.enabled
