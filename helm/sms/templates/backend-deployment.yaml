apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  labels:
    app: {{ .Values.backend.name }}
    version: v1
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
      version: v1
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
        version: v1
    spec:
    
      volumes:
        - name: model-data
          hostPath:
            path: {{ .Values.backend.storage.hostPath }}
            type: DirectoryOrCreate

      # -----------------------------
      # MAIN CONTAINERS
      # -----------------------------
      containers:
        # BACKEND CONTAINER
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.stableTag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}   
              name: {{ .Values.backend.service.portName }}
              
          envFrom:
            - configMapRef:
                name: {{ .Values.backend.name }}-config-stable

          env:
            - name: MODEL_VERSION
              value: "v1"


          volumeMounts:
            - name: model-data
              mountPath: {{ .Values.backend.storage.mountPath | quote }}



