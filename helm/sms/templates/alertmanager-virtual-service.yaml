{{- if and .Values.istio.enabled .Values.monitoring.enabled -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.monitoring.prometheusRelease }}-alertmanager-vs
spec:
  hosts:
  - {{ .Values.monitoring.hosts.alertmanager }}
  gateways:
  - {{ .Values.istio.ingressGateway.name }}
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: {{ .Values.monitoring.prometheusRelease }}-alertmanager
        port:
          number: 9093
{{- end }}