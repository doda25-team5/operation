apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-frontend-canary
  labels:
    app: sms-frontend
    version: v2
spec:
  replicas: {{ .Values.replicaCountFrontend }}
  selector:
    matchLabels:
      app: sms-frontend
      version: v2
  template:
    metadata:
      labels:
        app: sms-frontend
        version: v2
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.canaryTag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.frontend.service.port }}
          name: http
        envFrom:
          - configMapRef:
              name: sms-frontend-config