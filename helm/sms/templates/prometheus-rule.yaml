{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sms-backend-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: sms.rules
    rules:
    - alert: HighRequestRate
      expr: increase(sms_requests_total[2m]) > 30
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High request rate on SMS frontend"
        description: "More than ~15 requests/min for 2 minutes"
{{- end }}
