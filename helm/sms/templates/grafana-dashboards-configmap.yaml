{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sms-grafana-dashboards
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  app-metrics.json: |-
{{ (.Files.Get "files/dashboards/app-metrics.json") | indent 4 }}
  decision-a4.json: |-
{{ (.Files.Get "files/dashboards/decision-a4.json") | indent 4 }}
  model-metrics.json: |-
{{ (.Files.Get "files/dashboards/model-metrics.json") | indent 4 }}
{{- end }}
