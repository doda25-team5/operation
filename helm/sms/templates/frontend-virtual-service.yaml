apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.frontend.name }}-vs
spec:
  hosts:
    - {{ .Values.ingress.host.primary | quote }}
    - {{ .Values.ingress.host.stable | quote }}
    - {{ .Values.ingress.host.canary | quote }}
  gateways:
    - {{ .Values.istio.ingressGateway.name }}
  http:
    # Grading shortcuts (host-based)
    - match:
        - authority:
            exact: {{ .Values.ingress.host.canary | quote }}
      route:
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: canary
      headers:
        response:
          set:
            version: "v2-direct"

    - match:
        - authority:
            exact: {{ .Values.ingress.host.stable | quote }}
      route:
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: stable
      headers:
        response:
          set:
            version: "v1-direct"

    # -------------------------------
    # Cookie-based persistence
    # -------------------------    # -------------------------------------
    - match:
        - headers:
            cookie:
              regex: ".*sms-user=stable.*"
      route:
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: stable
      headers:
        response:
          set:
            version: "v1"

    - match:
        - headers:
            cookie:
              regex: ".*sms-user=canary.*"
      route:
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: canary
      headers:
        response:
          set:
            version: "v2"

    # -------------------------------
    # Canary experiment (90/10)
    # -------------------------------
    {{- if eq .Values.traffic.mode "canary" }}
    - route:
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: stable
          weight: 90
          headers:
            response:
              add:
                Set-Cookie: "sms-user=stable; Path=/"
              set:
                version: "v1"
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: canary
          weight: 10
          headers:
            response:
              add:
                Set-Cookie: "sms-user=canary; Path=/"
    {{- else }}
    # -------------------------------
    # Standard mode (100% stable)
    # -------------------------------
    - route:
        - destination:
            host: {{ .Values.frontend.service.name }}
            subset: stable
          weight: 100
      headers:
        response:
          set:
            version: "v1"
    {{- end }}
