{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.backend.name }}-dr
spec:
  host: {{ .Values.backend.service.name }} 
  subsets:
    - name: stable
      labels:
        version: v1
    - name: canary
      labels:
        version: v2
    - name: shadow
      labels:
        version: v3

{{- end }}
