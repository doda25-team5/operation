{{- if and .Values.istio.enabled .Values.monitoring.enabled -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.monitoring.prometheusRelease }}-grafana-vs
spec:
  hosts:
  - {{ .Values.monitoring.hosts.grafana }}
  gateways:
  - {{ .Values.istio.ingressGateway.name }}
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        # Verify this service name with: kubectl get svc
        host: sms-grafana 
        port:
          number: 80
{{- end }}