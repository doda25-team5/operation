{{- if and .Values.ingress.enabled (not .Values.istio.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.frontend.name }}-ingress
  labels:
    app: {{ .Values.frontend.name }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # ------------------------------------------------
    # 1. Frontend Application
    # ------------------------------------------------
    - host: {{ .Values.ingress.host.primary | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.service.name }}
                port:
                  number: {{ .Values.frontend.service.port }}

    # ------------------------------------------------
    # 2. Monitoring Tools (Added)
    # ------------------------------------------------
    {{- if .Values.monitoring.enabled }}
    
    # Prometheus (Service: sms-monitor-prometheus)
    - host: {{ .Values.monitoring.hosts.prometheus | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.monitoring.prometheusRelease }}-prometheus
                port:
                  number: 9090

    # Grafana (Service: sms-grafana)
    - host: {{ .Values.monitoring.hosts.grafana | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sms-grafana  # Hardcoded to match your kubectl get svc output
                port:
                  number: 80

    # AlertManager (Service: sms-monitor-alertmanager)
    - host: {{ .Values.monitoring.hosts.alertmanager | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.monitoring.prometheusRelease }}-alertmanager
                port:
                  number: 9093
    {{- end }}
{{- end }}