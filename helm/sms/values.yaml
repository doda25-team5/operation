replicaCountFrontend: 1
replicaCountBackend: 1

frontend:
  image:
    repository: ghcr.io/doda25-team5/sms-frontend
    stableTag: "1.0.0" #TODO: be updated to actual stable
    canaryTag: "latest" #TODO: be updated to actual canary
    pullPolicy: IfNotPresent
  service:
    port: 8080

backend:
  image:
    repository: ghcr.io/doda25-team5/sms-backend
    stableTag: "latest" #TODO: be updated to actual stable
    canaryTag: "latest" #TODO: be updated to actual canary
    pullPolicy: IfNotPresent
  service:
    port: 8081
  model:
    dir: "/root/sms/output"
    filename: "model.joblib"
    preproc_filename: "preprocessor.joblib"
    url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
    preproc_url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

initContainer:
  enabled: false
  enableHostPath: false
  hostPath: /mnt/shared/model-data

ingress:
  enabled: true
  host: sms.test.local
  path: "/"

monitoring:
  enabled: true
  exporter:
    image: ghcr.io/doda25-team5/sms-exporter
    tag: "0.1"
  alerts:
    email:
      enabled: true
      to: "nicoloaiza16@gmail.com"
      from: "nicoloaiza16@gmail.com"
      username: "nicoloaiza16@gmail.com"

secrets:
  create: false
  smtp_user: ""
  smtp_pass: ""

ingressgateway:
  ingressGatewayLabel: ingressgateway


hostPath:
  enabled: false
  path: /mnt/shared
  mountPath: /mnt/shared