# --------------------------------------------------
# Global Namespaces (single source of truth)
# --------------------------------------------------
global:
  namespaces:
    app: default
    monitoring: default

# --------------------------------------------------
# Istio
# --------------------------------------------------
istio:
  enabled: true
  ingressGateway:
    name: sms-gateway
    selector: ingressgateway

# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  name: sms-frontend

  replicas: 1
  canaryReplicas: 1

  image:
    repository: ghcr.io/doda25-team5/sms-frontend
    stableTag: "0.0.2-feature-frontend-stable-metrics-fix-260121-170055"
    canaryTag: "0.0.3-feature-new-ui-260121-172601"
    pullPolicy: IfNotPresent

  service:
    name: sms-frontend-svc
    port: 8084
    portName: http
    type: ClusterIP

  config:
    backendHost: sms-backend-svc
    backendPort: 8082

# --------------------------------------------------
# Backend
# --------------------------------------------------
backend:
  name: sms-backend

  replicas: 1
  canaryReplicas: 1

  image:
    repository: ghcr.io/doda25-team5/sms-backend
    stableTag: "latest"
    canaryTag: "latest"
    shadowTag: "latest"
    pullPolicy: IfNotPresent

  service:
    name: sms-backend-svc
    port: 8082
    type: ClusterIP
    portName: metrics

  model:
    stable:
      dir: "/mnt/shared/stable"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

    canary:
      dir: "/mnt/shared/canary"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib" # Intentionally same model as stable (frontend-only experiment)
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

    shadow:
      dir: "/mnt/shared/shadow"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib" # TODO: change to shadow model
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

  shadow:
    enabled: true
    replicas: 1

  storage:
    enabled: true
    type: hostPath
    hostPath: /mnt/shared
    mountPath: /mnt/shared

# --------------------------------------------------
# Traffic Management (Istio)
# --------------------------------------------------
traffic:
  mode: canary   # standard | canary

ingress:
  enabled: false
  className: nginx
  host:
    primary: sms.test.local
    stable: stable.local
    canary: canary.local

# --------------------------------------------------
# Monitoring (app-owned)
# --------------------------------------------------
monitoring:
  enabled: true

  # Name of the Prometheus stack (used for labels & selectors)
  prometheusRelease: sms-monitor

  alerts:
    email:
      enabled: true
      to: "priyansh.rajusth@gmail.com"
      from: "priyansh.rajusth@gmail.com"
      username: "priyansh.rajusth@gmail.com"

# --------------------------------------------------
# kube-prometheus-stack (Helm dependency)
# --------------------------------------------------
kube-prometheus-stack:
  fullnameOverride: sms-monitor
  
  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelector:
        matchLabels:
          release: sms-monitor
      ruleSelector:
        matchLabels:
          release: sms-monitor
    
  alertmanager:
    enabled: true
    alertmanagerSpec:
      alertmanagerConfigSelector:
        matchLabels:
          release: sms-monitor
      alertmanagerConfigNamespaceSelector:
        matchNames:
          - default

  grafana:
    enabled: true
    adminUser: admin
    adminPassword: admin123

# --------------------------------------------------
# Secrets
# --------------------------------------------------
secrets:
  smtp:
    existingSecret: sms-secrets
    passwordKey: smtp_pass

# --------------------------------------------------
# Rate Limiting
# --------------------------------------------------
rateLimiting:
  enabled: false
