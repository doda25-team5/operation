replicaCountFrontend: 1
replicaCountBackend: 1

frontend:
  image:
    repository: ghcr.io/doda25-team5/sms-frontend
    stableTag: "2.1.1" #TODO: be updated to actual stable [for now it's an old version of 'stable']
    canaryTag: "latest" #TODO: be updated to actual canary
    pullPolicy: IfNotPresent
  service:
    port: 8080

backend:
  image:
    repository: ghcr.io/doda25-team5/sms-backend
    stableTag: "latest" #TODO: be updated to actual stable
    canaryTag: "latest" #TODO: be updated to actual canary
    pullPolicy: IfNotPresent
  service:
    port: 8081
  model:
    dir: "/root/sms/output"
    filename: "model.joblib"
    preproc_filename: "preprocessor.joblib"
    url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
    preproc_url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

initContainer:
  enabled: false
  enableHostPath: false
  hostPath: /mnt/shared/model-data

ingress:
  enabled: false
  host: sms.test.local           # Cookies logic + 90/10 splitting
  stableHost: stable.local       # -- NEW: Forces traffic to Stable for grading
  canaryHost: canary.local       # -- NEW: Forces traffic to Canary for grading
  path: "/"

monitoring:
  enabled: true
  prometheusRelease: "sms-monitor"
  alerts:
    email:
      enabled: true
      to: "priyansh.rajusth@gmail.com"
      from: "priyansh.rajusth@gmail.com"
      username: "priyansh.rajusth@gmail.com"

secrets:
  create: false
  smtp_user: ""
  smtp_pass: ""

ingressgateway:
  ingressGatewayLabel: ingressgateway

hostPath:
  enabled: false
  path: /mnt/shared
  mountPath: /mnt/shared

# Traffic Control Mode
# Options: "standard" (100% stable), "shadow" (mirror to canary), "canary" (90/10 split)
traffic:
  mode: "standard"