# --------------------------------------------------
# Namespaces (created by Helm)
# --------------------------------------------------
namespaces:
  monitoring: monitoring

# --------------------------------------------------
# Istio
# --------------------------------------------------
istio:
  enabled: true
  ingressGateway:
    name: sms-gateway
    selector: ingressgateway
# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  name: sms-frontend

  replicas: 1
  canaryReplicas: 1

  image:
    repository: ghcr.io/doda25-team5/sms-frontend
    stableTag: "0.0.1"
    canaryTag: "0.0.2-feature-new-ui-260118-161200"
    pullPolicy: IfNotPresent

  service:
    name: sms-frontend-svc
    port: 8084
    portName: http
    type: ClusterIP

  config:
    backendHost: sms-backend-svc
    backendPort: 8082

# --------------------------------------------------
# Backend
# --------------------------------------------------
backend:
  name: sms-backend

  replicas: 1
  canaryReplicas: 1

  image:
    repository: ghcr.io/doda25-team5/sms-backend
    stableTag: "latest"
    canaryTag: "latest"
    shadowTag: "latest"
    pullPolicy: IfNotPresent

  service:
    name: sms-backend-svc
    port: 8082
    type: ClusterIP
    portName: metrics

  model:
    stable:
      dir: "/mnt/shared/stable"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

    canary:
      dir: "/mnt/shared/canary"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib" # Intentionally same model as stable (frontend-only experiment)
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

    shadow:
      dir: "/mnt/shared/shadow"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib" # TODO: change to shadow model
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

  shadow:
    enabled: true
    replicas: 1

  storage:
    enabled: true
    type: hostPath          # REQUIRED FOR EXCELLENT
    hostPath: /mnt/shared
    mountPath: /mnt/shared

# --------------------------------------------------
# Traffic Management (Istio)
# --------------------------------------------------
traffic:
  mode: canary   # standard | canary

ingress:
  enabled: false
  host:
    primary: sms.test.local
    stable: stable.local
    canary: canary.local

# --------------------------------------------------
# Monitoring
# --------------------------------------------------
monitoring:
  enabled: true
  prometheusRelease: sms-monitor  #should match the release/stack name of prometheus installation

  alerts:
    email:
      enabled: true
      to: "priyansh.rajusth@gmail.com"
      from: "priyansh.rajusth@gmail.com"
      username: "priyansh.rajusth@gmail.com"

# --------------------------------------------------
# Secrets
# --------------------------------------------------
secrets:
  smtp:
    existingSecret: sms-secrets
    passwordKey: smtp_pass


# --------------------------------------------------
# Rate Limiting
# --------------------------------------------------
rateLimiting:
  enabled: False
