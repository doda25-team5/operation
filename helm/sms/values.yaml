# --------------------------------------------------
# Namespaces (created by Helm)
# --------------------------------------------------
namespaces:
  monitoring: monitoring

# --------------------------------------------------
# Istio
# --------------------------------------------------
istio:
  enabled: true
  ingressGateway:
    name: sms-gateway
    selector: ingressgateway
# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  name: sms-frontend

  replicas: 1
  canaryReplicas: 1

  image:
    repository: ghcr.io/doda25-team5/sms-frontend
    stableTag: "2.1.1"
    canaryTag: "latest"
    pullPolicy: IfNotPresent

  service:
    name: sms-frontend-svc
    port: 8080
    portName: http
    type: ClusterIP

  config:
    backendHost: sms-backend-svc
    backendPort: 8081

# --------------------------------------------------
# Backend
# --------------------------------------------------
backend:
  name: sms-backend

  replicas: 1
  canaryReplicas: 1

  image:
    repository: ghcr.io/doda25-team5/sms-backend
    stableTag: "latest"
    canaryTag: "latest"
    shadowTag: "latest"
    pullPolicy: IfNotPresent

  service:
    name: sms-backend-svc
    port: 8081
    type: ClusterIP
    portName: metrics

  model:
    dir: "/mnt/shared/models"
    filename: "model.joblib"
    preprocessorFilename: "preprocessor.joblib"
    url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
    preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

  shadow:
    enabled: true
    replicas: 1

  storage:
    enabled: true
    type: hostPath          # REQUIRED FOR EXCELLENT
    hostPath: /mnt/shared
    mountPath: /mnt/shared

# --------------------------------------------------
# Traffic Management (Istio)
# --------------------------------------------------
traffic:
  mode: canary   # standard | canary

ingress:
  enabled: false
  host:
    primary: sms.test.local
    stable: stable.local
    canary: canary.local

# --------------------------------------------------
# Monitoring
# --------------------------------------------------
monitoring:
  enabled: true
  prometheusRelease: sms-monitor  #should match the release/stack name of prometheus installation

  alerts:
    email:
      enabled: true
      to: "priyansh.rajusth@gmail.com"
      from: "priyansh.rajusth@gmail.com"
      username: "priyansh.rajusth@gmail.com"

# --------------------------------------------------
# Secrets
# --------------------------------------------------
secrets:
  smtp:
    existingSecret: sms-secrets
    passwordKey: smtp_pass


# --------------------------------------------------
# Rate Limiting
# --------------------------------------------------
rateLimiting:
  enabled: False
