# ==================================================
# SMS Checker - Helm Values
# ==================================================
# This chart supports two deployment modes:
#
# MODE 1: Ingress-only (no Istio)
#   - Set: istio.enabled = false
#   - Set: ingress.enabled = true
#   - Access via: Nginx Ingress Controller
#   - Use case: A3 requirements, simple deployments
#
# MODE 2: Istio Service Mesh
#   - Set: istio.enabled = true
#   - Set: ingress.enabled = false
#   - Access via: Istio Gateway + VirtualServices
#   - Use case: A4 requirements, canary, shadow launch
# ==================================================

# --------------------------------------------------
# Istio Configuration
# --------------------------------------------------
istio:
  enabled: true  # Toggle between Istio and Ingress-only modes
  
  # Ingress Gateway Configuration
  # NOTE: The gateway itself is provisioned during cluster setup (A2)
  # This chart only creates Gateway/VirtualService resources that reference it
  ingressGateway:
    name: sms-gateway           # Name of the Gateway resource created by this chart
    selector: ingressgateway    # Label selector for the Istio ingress gateway pods

# --------------------------------------------------
# Frontend (SMS Checker Web UI)
# --------------------------------------------------
frontend:
  name: sms-frontend

  # Replica configuration
  replicas: 3         # Stable version (v1)
  canaryReplicas: 2   # Canary version (v2)

  # Container images
  image:
    repository: ghcr.io/doda25-team5/sms-frontend
    stableTag: "0.0.2"
    canaryTag: "0.0.3-feature-new-ui-260121-172601"
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    name: sms-frontend-svc
    port: 8084
    portName: http
    type: ClusterIP

  # Backend connection settings
  config:
    backendHost: sms-backend-svc
    backendPort: 8082

# --------------------------------------------------
# Backend (Model Service API)
# --------------------------------------------------
backend:
  name: sms-backend

  # Replica configuration
  replicas: 1         # Stable version (v1)
  canaryReplicas: 1   # Canary version (v2)

  # Container images
  image:
    repository: ghcr.io/doda25-team5/sms-backend
    stableTag: "latest"
    canaryTag: "latest" # TODO change for canary release
    shadowTag: "latest"  # Shadow launch (v3) -> TODO change for shadow release
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    name: sms-backend-svc
    port: 8082
    type: ClusterIP
    portName: metrics  # Exposed for Prometheus scraping

  # Model file configuration
  # Models are downloaded on first startup and cached in hostPath volume
  model:
    stable:
      dir: "/mnt/shared/stable"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

    canary:
      dir: "/mnt/shared/canary"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      # NOTE: Intentionally same model as stable (frontend-only A4 experiment)
      url: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/model.joblib"
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/test-f9-ghcli/preprocessor.joblib"

    shadow:
      dir: "/mnt/shared/shadow"
      filename: "model.joblib"
      preprocessorFilename: "preprocessor.joblib"
      # TODO: Change to actual shadow model URL when available
      url: "https://github.com/doda25-team5/model-service/releases/download/shadow/model.joblib"
      preprocessorUrl: "https://github.com/doda25-team5/model-service/releases/download/shadow/preprocessor.joblib"

  # Shadow launch configuration (A4 additional use case)
  shadow:
    enabled: true
    replicas: 1

  # Persistent storage for model files
  # Mounts VirtualBox shared folder from cluster provisioning (A2)
  storage:
    enabled: true
    type: hostPath
    hostPath: /mnt/shared        # Must match VirtualBox shared folder mount
    mountPath: /mnt/shared       # Container mount path

# --------------------------------------------------
# Traffic Management
# --------------------------------------------------
traffic:
  mode: canary  # Options: standard | canary
  # - standard: 100% stable version
  # - canary: 90/10 split with sticky sessions

# --------------------------------------------------
# Ingress (Nginx - used when Istio is disabled)
# --------------------------------------------------
ingress:
  enabled: false  # Default: true for ingress-only mode
  className: nginx
  
  # Host configuration
  # Add these to /etc/hosts pointing to Ingress Controller IP
  host:
    primary: sms.test.local   # Main app access
    stable: stable.local      # Direct access to stable version (for grading)
    canary: canary.local      # Direct access to canary version (for grading)

# --------------------------------------------------
# Monitoring (Prometheus, Grafana, AlertManager)
# --------------------------------------------------
monitoring:
  enabled: true
  
  # Release name used for label matching
  # MUST match kube-prometheus-stack.fullnameOverride, and all the matchLabels below
  prometheusRelease: sms-monitor
  hosts:
    grafana: grafana.local
    prometheus: prometheus.local
    alertmanager: alertmanager.local

  # Email alerting configuration
  alerts:
    email:
      enabled: true
      to: "gandhivedant01@gmail.com"
      from: "gandhivedant01@gmail.com"
      username: "gandhivedant01@gmail.com"
      password: "PLACEHOLDER_SET_WITH_HELM_INSTALL"  
      # password: must be provided via --set monitoring.alerts.email.password="your-gmail-app-password"
      secretName: sms-secrets  # ← Name of the Secret to create
      secretKey: smtp_pass     # ← Key within the Secret

# --------------------------------------------------
# kube-prometheus-stack (Helm Chart Dependency)
# --------------------------------------------------
# This installs Prometheus, Grafana, and AlertManager
kube-prometheus-stack:
  fullnameOverride: sms-monitor
  
  prometheus:
    enabled: true
    prometheusSpec:
      # Only scrape ServiceMonitors with matching label
      serviceMonitorSelector:
        matchLabels:
          release: sms-monitor
      # Only load PrometheusRules with matching label
      ruleSelector:
        matchLabels:
          release: sms-monitor
    
  alertmanager:
    enabled: true
    alertmanagerSpec:
      # Only load AlertmanagerConfigs with matching label
      alertmanagerConfigSelector:
        matchLabels:
          release: sms-monitor

  grafana:
    enabled: true
    adminUser: admin
    adminPassword: admin123

  prometheusOperator:
    admissionWebhooks:
      patch:
        podAnnotations:
          sidecar.istio.io/inject: "false"
      cleanupProxy:
        podAnnotations:
          sidecar.istio.io/inject: "false"