version: "3.8"

services:
  model-service:
    image: ghcr.io/doda25-team5/sms-backend:${IMAGE_TAG:-latest}
    container_name: model-service
    ports:
      - "8081:8081"
    environment:
      - MODEL_PORT=8081
    volumes:
      - ./model-data:/app/output
    restart: unless-stopped

  frontend:
    image: ghcr.io/doda25-team5/sms-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      - MODEL_HOST=http://model-service:8081
      - SERVER_PORT=8080
    depends_on:
      - model-service
    restart: unless-stopped

