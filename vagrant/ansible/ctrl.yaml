- hosts: ctrl
  become: true
  vars:
    #task 13
    api_server_ip: "192.168.56.100"
    pod_network_cidr: "10.244.0.0/16"
    admin_conf_path: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Check for existing admin.conf
      ansible.builtin.stat:
        path: "{{ admin_conf_path }}"
      register: adminconf

    - name: Initialize Kubernetes control plane (kubeadm init) if needed
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ api_server_ip }}
        --pod-network-cidr={{ pod_network_cidr }}
        --node-name ctrl
      when: not adminconf.stat.exists
      args:
        creates: "{{ admin_conf_path }}"
      register: kubeadm_init_result


      #task 14
    - name: Ensure vagrant .kube exists
      file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0755"

    - name: Copy admin.conf to vagrant kubeconfig if present
      copy:
        src: "{{ admin_conf_path }}"
        dest: /home/vagrant/.kube/config
        remote_src: yes
        owner: vagrant
        group: vagrant
        mode: "0644"
      when: adminconf.stat.exists or kubeadm_init_result.changed #--

    - name: Copy admin.conf to shared /vagrant for host access
      copy:
        src: "{{ admin_conf_path }}"
        dest: /vagrant/admin.conf
        remote_src: yes
        owner: vagrant
        group: vagrant
        mode: "0644"
      when: adminconf.stat.exists

    # - name: Ensure vagrant/admin.conf is gitignored (repo-side)
    #   lineinfile:
    #     path: "{{ playbook_dir }}/../../.gitignore"
    #     regexp: '(^|\\n)vagrant/admin.conf\\s*$'
    #     line: 'vagrant/admin.conf'
    #     insertafter: EOF
    #   delegate_to: localhost
    #   run_once: true
    #   when: adminconf.stat.exists
     
      #task 15
    - name: Download flannel manifest
      get_url:
        url: https://raw.githubusercontent.com/flannel-io/flannel/v0.26.7/Documentation/kube-flannel.yml
        dest: /tmp/kube-flannel.yml
        mode: '0644'

    - name: Ensure --iface=eth1 is present (idempotent)
      lineinfile:
        path: /tmp/kube-flannel.yml
        regexp: '^\s*- --iface=.*'
        line: '        - --iface=eth1'
        insertafter: 'args:'
        state: present

    - name: Apply flannel manifest
      command: kubectl apply -f /tmp/kube-flannel.yml
      environment:
        KUBECONFIG: "{{ admin_conf_path }}"
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Wait for kube-flannel daemonset rollout
      command: kubectl -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout=300s
      environment:
        KUBECONFIG: "{{ admin_conf_path }}"
      register: rollout
      retries: 10
      delay: 6
      until: rollout.rc == 0

    - name: Wait for CoreDNS to be Running
      shell: kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].status.phase}'
      environment:
        KUBECONFIG: "{{ admin_conf_path }}"
      register: dns_status
      retries: 12
      delay: 5
      until: "'Running' in dns_status.stdout"

    #task 16
    #https://deploy-preview-1750--helm-merge.netlify.app/docs/intro/install/#from-apt-debianubuntu -> helm-debian for ubuntu
    - name: Ensure prerequisite packages (gpg, curl, apt-transport-https) are installed
      ansible.builtin.apt:
        name: 
          - gpg
          - curl
          - apt-transport-https
        state: present
      become: true

    - name: Download and Register Helm GPG key from Buildkite
      ansible.builtin.shell: |
        curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/helm.gpg > /dev/null
      args:
        # use creates to ensure this task only runs once and is idempotent
        creates: /usr/share/keyrings/helm.gpg
      become: true

    - name: Add Helm apt repository (using the new Buildkite source)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
        state: present
        filename: helm-stable-debian
      become: true

    - name: Update apt cache and install Helm
      ansible.builtin.apt:
        name: helm
        state: present
        update_cache: yes
      become: true


    #task 17
    - name: Ensure git is installed (--required for helm-diff plugin)
      ansible.builtin.apt:
        name: git
        state: present
      become: true

    - name: Install helm-diff plugin for vagrant user
      ansible.builtin.command:
        cmd: helm plugin install https://github.com/databus23/helm-diff
      become: true
      become_user: vagrant
      environment:
        HELM_DATA_HOME: /home/vagrant/.local/share/helm
      args:

        creates: /home/vagrant/.local/share/helm/plugins/helm-diff