---
# PREPARE PYTHON ENVIRONMENT + VENV (inside VM)
- name: Setup python environment + venv for Ansible Kubernetes usage
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure vagrant user has passwordless sudo
      lineinfile:
        path: /etc/sudoers.d/vagrant-nopasswd
        create: yes
        mode: "0440"
        line: "vagrant ALL=(ALL) NOPASSWD: ALL"
        validate: "visudo -cf %s"
      when: ansible_user == "vagrant"

    - name: Install python3-pip and python3-venv
      apt:
        name:
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Create a Python venv for Ansible kubernetes collection
      command: python3 -m venv /home/vagrant/.ansible-venv
      args:
        creates: /home/vagrant/.ansible-venv/bin/pip
      become_user: vagrant

    - name: Upgrade pip inside the venv
      pip:
        name: pip
        state: latest
        executable: /home/vagrant/.ansible-venv/bin/pip
      become_user: vagrant

    - name: Install kubernetes Python client inside the venv
      pip:
        name: kubernetes>=24.2.0
        executable: /home/vagrant/.ansible-venv/bin/pip
      become_user: vagrant

    - name: Tell Ansible to use our venv Python interpreter from now on
      set_fact:
        ansible_python_interpreter: /home/vagrant/.ansible-venv/bin/python


# Finalization: MetalLB + Ingress-NGINX + Dashboard + Istio
- name: Finalization - MetalLB + Ingress-NGINX + Dashboard + Istio
  hosts: all
  become: true
  gather_facts: false

  vars:
    kubeconfig_path: /home/vagrant/.kube/config
    istio_version: "1.25.2"

  tasks:
      
      #Copy files needed for MetalLB to VM
    - name: Copy MetalLB CRD manifest
      copy:
        src: "{{ playbook_dir }}/metallb-native.yaml"
        dest: /home/vagrant/metallb-native.yaml
        owner: vagrant
        group: vagrant
        mode: "0644"

    - name: Copy MetalLB IPAddressPool manifest
      copy:
        src: "{{ playbook_dir }}/metallb-ipaddresspool.yaml"
        dest: /home/vagrant/metallb-ipaddresspool.yaml
        owner: vagrant
        group: vagrant
        mode: "0644"

    - name: Copy MetalLB L2Advertisement manifest
      copy:
        src: "{{ playbook_dir }}/metallb-l2advertisement.yaml"
        dest: /home/vagrant/metallb-l2advertisement.yaml
        owner: vagrant
        group: vagrant
        mode: "0644"

    # STEP 20 -> Install MetalLB

    - name: Apply MetalLB native CRD
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: /home/vagrant/metallb-native.yaml

    - name: Wait for MetalLB controller to be ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ kubeconfig_path }} wait -n metallb-system -l app=metallb,component=controller --for=condition=ready pod --timeout=60s
      register: _wait_ctrl
      until: _wait_ctrl.rc == 0
      retries: 15
      delay: 10

    - name: Wait for MetalLB speakers to be ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ kubeconfig_path }} wait -n metallb-system -l app=metallb,component=speaker --for=condition=ready pod --timeout=60s
      register: _wait_speaker
      until: _wait_speaker.rc == 0
      retries: 15
      delay: 10

    - name: Create MetalLB IPAddressPool
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: /home/vagrant/metallb-ipaddresspool.yaml

    - name: Create MetalLB L2Advertisement
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: /home/vagrant/metallb-l2advertisement.yaml



    # STEP 21 -> Install Ingress-NGINX

    - name: Add ingress-nginx Helm repo
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Install ingress-nginx via Helm
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        values:
          controller:
            service:
              loadBalancerIP: "192.168.56.90"
            admissionWebhooks:
              enabled: false


    - name: Wait for ingress-nginx controller to be ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ kubeconfig_path }} wait -n ingress-nginx -l app.kubernetes.io/component=controller --for=condition=ready pod --timeout=180s
      register: _wait_ing_ctrl
      until: _wait_ing_ctrl.rc == 0
      retries: 20
      delay: 10

    #Copy files needed for Dashboard to VM

    - name: Copy Dashboard ServiceAccount
      copy:
        src: "{{ playbook_dir }}/dashboard-serviceaccount.yaml"
        dest: /home/vagrant/dashboard-serviceaccount.yaml
        owner: vagrant
        group: vagrant
        mode: "0644"

    - name: Copy Dashboard ClusterRoleBinding
      copy:
        src: "{{ playbook_dir }}/dashboard-clusterrolebinding.yaml"
        dest: /home/vagrant/dashboard-clusterrolebinding.yaml
        owner: vagrant
        group: vagrant
        mode: "0644"

    - name: Copy Dashboard Ingress
      copy:
        src: "{{ playbook_dir }}/dashboard-ingress.yaml"
        dest: /home/vagrant/dashboard-ingress.yaml
        owner: vagrant
        group: vagrant
        mode: "0644"

    # STEP 22 -> Install Kubernetes Dashboard

    - name: Add kubernetes dashboard Helm repo
      kubernetes.core.helm_repository:
        name: kubernetes-dashboard
        repo_url: https://kubernetes.github.io/dashboard/

    - name: Install Kubernetes Dashboard via Helm
      kubernetes.core.helm:
        name: kubernetes-dashboard
        chart_ref: kubernetes-dashboard/kubernetes-dashboard
        release_namespace: kubernetes-dashboard
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}" 

    - name: Apply Dashboard ServiceAccount
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: /home/vagrant/dashboard-serviceaccount.yaml

    - name: Apply Dashboard ClusterRoleBinding
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: /home/vagrant/dashboard-clusterrolebinding.yaml

    - name: Apply Dashboard Ingress
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        src: /home/vagrant/dashboard-ingress.yaml


    # STEP 23 -> Install Istio

    - name: Check if Istio folder exists
      ansible.builtin.stat:
        path: "/opt/istio-{{ istio_version }}/bin/istioctl"
      register: istio_binary

    - name: Detect system architecture
      ansible.builtin.command: uname -m
      register: system_arch
      changed_when: false

    - name: Set Istio architecture
      ansible.builtin.set_fact:
        istio_arch: "{{ 'arm64' if system_arch.stdout in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Download Istio {{ istio_version }}
      ansible.builtin.get_url:
        url: "https://github.com/istio/istio/releases/download/{{ istio_version }}/istio-{{ istio_version }}-linux-{{ istio_arch }}.tar.gz"
        dest: /tmp/istio.tar.gz
        mode: '0644'
      when: not istio_binary.stat.exists

    - name: Extract Istio
      ansible.builtin.unarchive:
        src: /tmp/istio.tar.gz
        dest: /opt
        remote_src: yes
      when: not istio_binary.stat.exists

    - name: Ensure Istio directory is accessible
      ansible.builtin.file:
        path: "/opt/istio-{{ istio_version }}"
        mode: '0755'
        recurse: yes

    - name: Ensure Istio bin directory is accessible
      ansible.builtin.file:
        path: "/opt/istio-{{ istio_version }}/bin"
        mode: '0755'

    - name: Ensure istioctl binary is executable
      ansible.builtin.file:
        path: "/opt/istio-{{ istio_version }}/bin/istioctl"
        mode: '0755'

    - name: Add istioctl to PATH for vagrant user
      become_user: vagrant
      ansible.builtin.lineinfile:
        path: /home/vagrant/.bashrc
        line: "export PATH=$PATH:/opt/istio-{{ istio_version }}/bin"
        create: yes

    - name: Symlink istioctl to /usr/local/bin
      ansible.builtin.file:
        src: "/opt/istio-{{ istio_version }}/bin/istioctl"
        dest: /usr/local/bin/istioctl
        state: link
        force: yes

    - name: Create Istio configuration with fixed LoadBalancer IP
      ansible.builtin.copy:
        content: |
          apiVersion: install.istio.io/v1alpha1
          kind: IstioOperator
          spec:
            profile: default
            components:
              ingressGateways:
              - name: istio-ingressgateway
                enabled: true
                k8s:
                  service:
                    type: LoadBalancer
                    loadBalancerIP: 192.168.56.91
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
            values:
              pilot:
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
        dest: /home/vagrant/istio-config.yaml
        owner: vagrant
        group: vagrant
        mode: '0644'

    - name: Check if Istio is already installed
      ansible.builtin.shell: kubectl --kubeconfig {{ kubeconfig_path }} get deployment istiod -n istio-system 2>/dev/null || echo "not_installed"
      register: istio_check
      changed_when: false

    - name: Install Istio with custom configuration
      become_user: vagrant
      ansible.builtin.command: /usr/local/bin/istioctl install -y -f /home/vagrant/istio-config.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when: istio_check.stdout == "not_installed"
      register: istio_install
      async: 600
      poll: 10

    - name: Wait for Istio control plane (istiod) to be ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ kubeconfig_path }} wait -n istio-system -l app=istiod --for=condition=ready pod --timeout=300s
      register: _wait_istiod
      until: _wait_istiod.rc == 0
      retries: 10
      delay: 15
      when: istio_check.stdout == "not_installed"

    - name: Wait for Istio ingressgateway to be ready
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ kubeconfig_path }} wait -n istio-system -l app=istio-ingressgateway --for=condition=ready pod --timeout=300s
      register: _wait_istio_gateway
      until: _wait_istio_gateway.rc == 0
      retries: 10
      delay: 15
      when: istio_check.stdout == "not_installed"