- hosts: all
  become: yes
  tasks:
    # step 4
    - name: add SSH public keys to authorized_keys
      authorized_key:
        user: vagrant
        state: present
        key: "{{ lookup('file', item) }}"
      with_fileglob: 
        - "../keys/*.pub" 

    # step 5
    - name: disable SWAP
      command: swapoff -a

    - name: prevent re-mounting SWAP on reboot
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+\S+\s+swap\s'
        state: absent

    # step 6
    - name: bridging capabilities for Kubernetes
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: load overlay module
      modprobe:
        name: overlay
        state: present

    - name: load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present

    # step 7
    - name: enable IPv4 forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: enable bridged IPv4 iptables
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        state: present
        reload: yes

    - name: enable bridged IPv6 iptables
      sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: '1'
        state: present
        reload: yes

    # step 8
    - name: manage /etc/hosts
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED K8S HOSTS"
        block: |
          192.168.56.100 ctrl
          192.168.56.101 node-1
          192.168.56.102 node-2

    # step 9
    - name: install APT transport and GPG dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: yes

    - name: add Kubernetes APT repository GPG key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        state: present

    - name: add Kubernetes APT repository
      apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        filename: "kubernetes"
        state: present

    - name: update APT cache after adding Kubernetes repository
      apt:
        update_cache: yes

    # step 10
    - name: install Kubernetes components
      apt:
        name:
          - containerd
          - runc
        state: present
        update_cache: yes
    
    - name: install Kubernetes versions
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes   

    - name: hold Kubernetes packages at current version
      command: >
        apt-mark hold kubelet kubeadm kubectl 

    - name: enable and start containerd service
      systemd:
        name: containerd
        enabled: yes
        state: started  

  # step 11
    - name: ensure /etc/containerd directory exists
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: get default containerd config
      command: containerd config default
      register: containerd_default_config

    - name: write containerd config to /etc/containerd/config.toml
      copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout }}"

    - name: disable AppArmor in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: '^\s*disable_apparmor = .*'
        replace: 'disable_apparmor = true'

    - name: set sandbox image in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: '^\s*sandbox_image = ".*"$'
        replace: 'sandbox_image = "registry.k8s.io/pause:3.10"'

    - name: enable SystemdCgroup in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup = .*'
        replace: 'SystemdCgroup = true'

    - name: restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    #step 12
    - name: enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started