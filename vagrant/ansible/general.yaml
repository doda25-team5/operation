- hosts: all
  become: yes
  tasks:
    # step 4
    - name: add SSH public keys to authorized_keys
      authorized_key:
        user: vagrant
        state: present
        key: "{{ lookup('file', item) }}"
      with_fileglob: 
        - "../keys/*.pub" 

    # step 5
    - name: disable SWAP
      command: swapoff -a

    - name: prevent SWAP re-mount on next boot
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+\S+\s+swap\s'
        state: absent

    # step 6
    - name: bridging capabilities for Kubernetes
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: load overlay module
      modprobe:
        name: overlay
        state: present

    - name: load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present